<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Abdelrahman Hassan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #6eaa4e; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 2;
    color: #2a2118;
    font-family: "Press Start 2P", monospace;
    pointer-events: none;
    text-shadow: 2px 2px 0 rgba(255, 244, 220, 0.85);
  }
  #hud strong { display: block; font-size: 13px; letter-spacing: 1px; margin-bottom: 8px; }
  #hud span { display: block; font-size: 9px; margin-bottom: 12px; color: #4a3424; }
  #hint { font-size: 8px; line-height: 1.7; max-width: 280px; color: #3a2a1c; }
  #pad {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 2;
    display: grid;
    grid-template-columns: 62px 62px 62px;
    grid-template-areas: ". u ." "l d r";
    gap: 6px;
  }
  #pad button {
    width: 62px;
    height: 62px;
    font-family: "Press Start 2P", monospace;
    font-size: 14px;
    color: #2a2118;
    background: rgba(255, 244, 214, 0.92);
    border: 3px solid #2a2118;
    border-radius: 8px;
    box-shadow: 3px 3px 0 #2a2118;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pad button[data-dir="up"] { grid-area: u; }
  #pad button[data-dir="left"] { grid-area: l; }
  #pad button[data-dir="down"] { grid-area: d; }
  #pad button[data-dir="right"] { grid-area: r; }
  #pad button.held { background: #f0c36a; transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2a2118; }
  #err {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 5;
    background: #2a100c;
    color: #ffd0c4;
    font: 12px/1.4 monospace;
    padding: 10px;
    max-width: 90vw;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <strong>ABDELRAHMAN</strong>
  <span>HASSAN</span>
  <p id="hint">ARROWS OR WASD<br>UP · DOWN · LEFT · RIGHT</p>
</div>
<div id="pad" aria-label="Move">
  <button type="button" data-dir="up" aria-label="Walk up">▲</button>
  <button type="button" data-dir="left" aria-label="Walk left">◀</button>
  <button type="button" data-dir="down" aria-label="Walk down">▼</button>
  <button type="button" data-dir="right" aria-label="Walk right">▶</button>
</div>
<script src="game.js"></script>
</body>
</html>
