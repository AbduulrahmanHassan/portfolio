<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Abdelrahman's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07060c;color:#f4f6fb;font-family:Montserrat,Arial,sans-serif}
#stage{position:fixed;inset:0}
#css{position:absolute;inset:0;z-index:0;pointer-events:none}
#c{position:absolute;inset:0;z-index:1;display:block;touch-action:none;background:transparent}
body.playing #c,body.contact-open #c{pointer-events:none}
body.playing #css{pointer-events:auto}
#cross{position:fixed;left:50%;top:50%;width:9px;height:9px;margin:-5px 0 0 -5px;border:1px solid rgba(255,255,255,.8);border-radius:50%;z-index:3;pointer-events:none;display:none}
body.started #cross{display:block}
body.playing #cross,body.contact-open #cross{display:none}
#prompt{position:fixed;left:50%;bottom:10%;transform:translateX(-50%);z-index:3;pointer-events:none;font-family:Orbitron,Montserrat,sans-serif;font-size:clamp(12px,1.6vw,15px);font-weight:700;letter-spacing:.16em;color:#fff;padding:12px 18px;border:1px solid rgba(255,78,210,.9);background:rgba(8,6,14,.72);text-shadow:0 0 12px rgba(255,74,216,.35);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#playbar{position:fixed;top:18px;right:18px;z-index:4;display:flex;align-items:center;gap:12px}
#now-title{font-family:Orbitron,Montserrat,sans-serif;font-size:13px;letter-spacing:.12em;font-weight:700;color:rgba(255,255,255,.9)}
#exit,#contact-close{background:transparent;color:#ff4ad8;border:1px solid #ff4ad8;font-family:Orbitron,Montserrat,sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;padding:10px 16px;cursor:pointer}
#exit:hover,#contact-close:hover{background:rgba(255,74,216,.14)}
#welcome{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 40%,rgba(5,3,10,.78));text-align:center;padding:0 20px 7vh;pointer-events:none}
#welcome.hide{display:none}
#welcome .card{pointer-events:auto}
#enter{background:transparent;color:#ff4ad8;border:1px solid #ff4ad8;font-family:Orbitron,sans-serif;font-size:13px;font-weight:700;letter-spacing:.22em;padding:14px 28px;cursor:pointer}
#enter:hover{background:rgba(255,74,216,.14)}
#welcome .hint{margin-top:14px;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.78);line-height:1.7}
.cab-screen{background:#000;overflow:hidden;position:relative}
.cab-screen iframe{width:100%;height:100%;border:0;display:block;background:#000}

#loader{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a1230,#07060c 70%);text-align:center}
#loader.hide{opacity:0;pointer-events:none;transition:opacity .45s ease}
#loader .brand{font-family:Orbitron,sans-serif;font-size:clamp(18px,4vw,28px);letter-spacing:.28em;color:#ff4ad8;text-shadow:0 0 24px rgba(255,74,216,.45)}
#loader .bar{width:min(260px,60vw);height:3px;margin:22px auto 0;background:rgba(255,255,255,.12);overflow:hidden}
#loader .bar>i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#3ad7ff,#ff4ad8);animation:load 1.1s ease-in-out infinite}
#loader .msg{margin-top:14px;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.55)}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

#contact{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px);background:rgba(3,2,8,.78);backdrop-filter:blur(6px)}
#contact[hidden]{display:none !important}
.contact-panel{width:min(720px,100%);max-height:min(92vh,900px);overflow:auto;border:1px solid rgba(255,74,216,.75);background:linear-gradient(165deg,rgba(28,16,44,.98),rgba(8,6,14,.99));padding:clamp(22px,3.5vw,36px);box-shadow:0 0 40px rgba(255,74,216,.12)}
.contact-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.contact-top h2{font-family:Orbitron,sans-serif;font-size:clamp(20px,3.5vw,30px);letter-spacing:.14em;color:#ff4ad8}
.contact-top .role{margin-top:10px;font-size:clamp(14px,2vw,17px);letter-spacing:.02em;color:rgba(255,255,255,.78);line-height:1.45}
#contact-close{font-size:13px;padding:12px 18px;min-width:96px}
#contact-intro{font-size:clamp(14px,2vw,16px);line-height:1.65;color:rgba(255,255,255,.86);margin:0 0 22px;max-width:58ch}
#contact-links{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){#contact-links{grid-template-columns:1fr 1fr}}
.contact-link{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;background:rgba(255,255,255,.045);transition:border-color .18s,background .18s,transform .18s;cursor:pointer;border-radius:2px}
.contact-link:hover,.contact-link:focus-visible{border-color:#ff4ad8;background:rgba(255,74,216,.14);outline:none;transform:translateY(-1px)}
.contact-link .ico{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;border-radius:8px;background:rgba(255,255,255,.06)}
.contact-link .ico svg{width:22px;height:22px}
.contact-link .ico-in{color:#0a66c2}
.contact-link .ico-phone{color:#7dffb0}
.contact-link .ico-wa{color:#25d366}
.contact-link .ico-mail{color:#3ad7ff}
.contact-link .ico-gh{color:#f0f0f0}
.contact-link .ico-art{color:#1769ff}
.contact-link .ico-cv{color:#ffc14a}
.contact-link .txt{font-size:clamp(15px,2vw,17px);letter-spacing:.02em;word-break:break-word;font-weight:700}
.contact-link.is-cv{border-color:rgba(255,193,74,.55)}
@media (max-width:640px){
  #prompt{bottom:15%;font-size:11px;letter-spacing:.12em;padding:10px 12px}
  #welcome .hint{font-size:11px}
  #contact-links{grid-template-columns:1fr}
  .contact-link{min-height:58px}
  .contact-panel{padding:18px 14px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loader">
  <div>
    <div class="brand">ARCADE</div>
    <div class="bar"><i></i></div>
    <div class="msg" id="loader-msg">Loading room…</div>
  </div>
</div>
<div id="stage"><div id="css"></div></div>
<div id="cross"></div>
<div id="prompt" hidden>CLICK TO PLAY</div>
<div id="playbar">
  <span id="now-title" hidden></span>
  <button id="exit" type="button" hidden>EXIT</button>
</div>
<div id="welcome">
  <div class="card">
    <button id="enter" type="button">ENTER ARCADE</button>
    <p class="hint">WASD to move · Mouse to look · Click a machine to play<br/>Click the Contact terminal under the sign · Esc to close</p>
  </div>
</div>
<div id="contact" hidden>
  <div class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-name">
    <div class="contact-top">
      <div>
        <h2 id="contact-name">Contact</h2>
        <p class="role" id="contact-role"></p>
      </div>
      <button id="contact-close" type="button">CLOSE</button>
    </div>
    <p id="contact-intro"></p>
    <div id="contact-links"></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
